name: Acceptance checks

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.28'
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: api
        run: uv sync --locked --group dev --group qa
      - name: Lint Python
        working-directory: api
        run: uv run ruff check app tests ../scripts/browser_qa.py ../deploy/generate_cloudflare_nginx.py
      - name: Test API and isolated Redis
        working-directory: api
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: uv run pytest -q
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check frontend
        working-directory: web
        run: npm run check
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Browser workflow against built frontend and simulated model
        env:
          BROWSER_QA_CHROME: /usr/bin/google-chrome
        run: api/.venv/bin/python scripts/browser_qa.py
